<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户评估（内部）</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin-top: 1rem; }
    button { margin-top: 1rem; padding: 0.5rem 1rem; }
    #log { white-space: pre-wrap; background: #f5f5f5; padding: 1rem; margin-top: 1rem; font-size: 14px; }
    a.download { display: inline-block; margin-top: 1rem; }
    #progressWrap { display: none; margin-top: 1rem; }
    .bar_outer { background: #e5e7eb; border-radius: 8px; height: 14px; overflow: hidden; }
    .bar_inner { height: 100%; width: 0%; background: linear-gradient(90deg, #2563eb, #38bdf8); transition: width 0.35s ease; }
    #progressText { font-size: 13px; margin-top: 0.4rem; color: #374151; }
  </style>
</head>
<body>
  <h1>客户评估（内部）</h1>
  <p>上传 xlsx：列名尽量通用即可——常见中英文别名会自动映射；未识别的列会并入「备注」供模型参考；客户名称留空时会尝试用其它列文本推断。</p>

  <div id="progressWrap" aria-live="polite">
    <div class="bar_outer"><div id="progressBar" class="bar_inner"></div></div>
    <div id="progressText"></div>
  </div>

  <form id="f">
    <label>Excel 文件 <input type="file" name="file" accept=".xlsx" required /></label>
    <label><input type="checkbox" name="dry_run" /> 试运行（不调 DeepSeek，仅校验列）</label>
    <label><input type="checkbox" name="no_fetch" /> 不抓取网站（仅用表格与粘贴证据）</label>
    <label>每批行数（可选） <input type="number" name="batch_size" min="1" placeholder="如 15；留空则一次跑完全表" /></label>
    <label>最多处理行数（可选） <input type="number" name="limit" min="1" placeholder="留空表示全部；与上项同时填时优先按每批行数分批" /></label>
    <button type="submit">上传并开始</button>
  </form>

  <div id="log"></div>

  <script>
    const logEl = document.getElementById('log');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');

    function log(msg) { logEl.textContent += msg + '\n'; }

    function showProgress() {
      progressWrap.style.display = 'block';
      progressBar.style.width = '4%';
      progressText.textContent = '准备中…';
    }

    function hideProgress() {
      progressWrap.style.display = 'none';
      progressBar.style.width = '0%';
      progressText.textContent = '';
    }

    function updateProgressFromJob(j, st) {
      const p = j.progress;
      progressWrap.style.display = 'block';
      if (!p || typeof p !== 'object') {
        if (st === 'queued') {
          progressBar.style.width = '6%';
          progressText.textContent = '排队中…';
        } else if (st === 'started') {
          progressBar.style.width = '12%';
          progressText.textContent = '处理中（等待进度上报）…';
        }
        return;
      }
      const cur = Number(p.current) || 0;
      const tot = Number(p.total) || 0;
      let pct = 0;
      if (p.phase === 'write' || p.phase === 'done') pct = 100;
      else if (tot > 0) pct = Math.min(99, Math.round((100 * cur) / tot));
      progressBar.style.width = pct + '%';
      progressText.textContent = (p.message || p.phase || '') + (tot ? ' · ' + cur + '/' + tot + ' 行' : '');
    }

    async function apiFetch(url, opts = {}) {
      const user = sessionStorage.getItem('basic_user');
      const pass = sessionStorage.getItem('basic_pass');
      const headers = { ...opts.headers };
      if (user != null && pass != null) {
        headers['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(user + ':' + pass)));
      }
      const r = await fetch(url, { ...opts, headers });
      if (r.status === 401) {
        const u = prompt('内部站点用户名（若已配置 HTTP Basic）'); if (u === null) throw new Error('cancel');
        const p = prompt('密码'); if (p === null) throw new Error('cancel');
        sessionStorage.setItem('basic_user', u);
        sessionStorage.setItem('basic_pass', p);
        headers['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(u + ':' + p)));
        return fetch(url, { ...opts, headers });
      }
      return r;
    }

    /** 兼容旧接口返回 JobStatus.FAILED 与新接口返回 failed */
    function normJobStatus(raw) {
      const s = String(raw || '');
      const m = s.match(/JobStatus\.(\w+)/i);
      if (m) return m[1].toLowerCase();
      return s.toLowerCase();
    }

    function attachDownloadLink(folderJobId) {
      const a = document.createElement('a');
      a.className = 'download';
      a.href = '#';
      a.textContent = '下载结果 xlsx';
      logEl.appendChild(document.createElement('br'));
      logEl.appendChild(a);
      a.addEventListener('click', async (ev) => {
        ev.preventDefault();
        log('正在下载…');
        try {
          const dr = await apiFetch('/api/jobs/' + folderJobId + '/download');
          if (!dr.ok) {
            const hint = await dr.text();
            log('下载失败 HTTP ' + dr.status + '：' + (hint.slice(0, 200) || '请确认已登录或刷新页面重试'));
            return;
          }
          const blob = await dr.blob();
          const url = URL.createObjectURL(blob);
          const x = document.createElement('a');
          x.href = url;
          x.download = 'customer_eval_' + folderJobId + '.xlsx';
          x.click();
          URL.revokeObjectURL(url);
          log('已开始下载文件（若被浏览器拦截请查看下载栏或允许本站下载）。');
        } catch (err) {
          log('下载异常：' + err);
        }
      });
    }

    async function pollJobUntilDone(folderJobId, opts) {
      const isContinue = opts && opts.continue;
      let lastSt = null;
      const poll = async () => {
        const r = await apiFetch('/api/jobs/' + folderJobId);
        if (!r.ok) { log('查询失败: ' + r.status); return; }
        const j = await r.json();
        const st = normJobStatus(j.status);
        updateProgressFromJob(j, st);
        if (st !== lastSt) {
          log('状态: ' + st);
          if (st === 'started' && !isContinue) {
            log('说明：任务运行期间会抓取网站并调用模型；若填写了「每批行数」，每批结束后可先下载，再点「继续下一批」直到全表完成。');
          }
          lastSt = st;
        }
        if (st === 'finished') {
          progressBar.style.width = '100%';
          progressText.textContent = '已完成';
          log('完成: ' + JSON.stringify(j.result));
          attachDownloadLink(folderJobId);
          if (j.result && j.result.has_more) {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = '继续下一批';
            btn.style.marginTop = '0.5rem';
            logEl.appendChild(document.createElement('br'));
            logEl.appendChild(btn);
            btn.onclick = async () => {
              btn.remove();
              log('已提交下一批…');
              showProgress();
              const fd = new FormData();
              const drEl = document.querySelector('#f [name=dry_run]');
              const nfEl = document.querySelector('#f [name=no_fetch]');
              if (drEl && drEl.checked) fd.append('dry_run', 'on');
              if (nfEl && nfEl.checked) fd.append('no_fetch', 'on');
              const cr = await apiFetch('/api/jobs/' + folderJobId + '/continue', { method: 'POST', body: fd });
              if (!cr.ok) {
                hideProgress();
                log('继续失败: ' + cr.status + ' ' + await cr.text());
                return;
              }
              await pollJobUntilDone(folderJobId, { continue: true });
            };
          }
          return;
        }
        if (st === 'failed') {
          hideProgress();
          const err = j.error || '（无详细错误信息：请在服务器执行 docker compose logs worker --tail 100）';
          log('失败:\n' + err);
          return;
        }
        setTimeout(poll, 2000);
      };
      poll();
    }

    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      logEl.textContent = '';
      const fileInput = e.target.querySelector('input[type=file]');
      if (!fileInput.files || fileInput.files.length === 0) {
        log('请先选择一个 .xlsx 文件再提交。');
        return;
      }
      const fd = new FormData(e.target);
      log('上传中…');
      hideProgress();
      showProgress();
      progressText.textContent = '上传文件…';
      let res = await apiFetch('/api/jobs', { method: 'POST', body: fd });
      if (!res.ok) { hideProgress(); log('错误: ' + res.status + ' ' + await res.text()); return; }
      const data = await res.json();
      const jobId = data.job_id;
      log('任务目录 ID: ' + jobId + '，排队中…');

      await pollJobUntilDone(jobId, { continue: false });
    };
  </script>
</body>
</html>
