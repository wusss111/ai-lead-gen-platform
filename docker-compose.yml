# ============================================================
#  AI 获客平台 — 生产环境 Docker Compose
# ============================================================
#  启动: docker compose up -d
#  停止: docker compose down
#  查看: docker compose ps
#  日志: docker compose logs -f <service>
# ============================================================

services:
  # ---- Redis (仅 Docker 内网可见) ----
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data

  # ---- Web 服务 (FastAPI + uvicorn) ----
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    image: ai-lead-platform:latest
    command: >
      python -m uvicorn src.core.app:app
      --host 0.0.0.0
      --port 8000
      --log-level warning
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PLATFORM_DATA_DIR=/data
    env_file:
      - .env
    volumes:
      - platform_data:/data
      - ./var/gmail_client_secret.json:/app/var/gmail_client_secret.json:ro
      - ./var/gmail_token.json:/app/var/gmail_token.json:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ---- RQ Worker: 客户评估 ----
  worker-eval:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    image: ai-lead-platform:latest
    command: rq worker -u redis://redis:6379/0 customer_eval:default
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PLATFORM_DATA_DIR=/data
    env_file:
      - .env
    volumes:
      - platform_data:/data
      - ./var/gmail_client_secret.json:/app/var/gmail_client_secret.json:ro
      - ./var/gmail_token.json:/app/var/gmail_token.json:ro
    depends_on:
      redis:
        condition: service_healthy

  # ---- RQ Worker: 邮件生成 ----
  worker-mail:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    image: ai-lead-platform:latest
    command: rq worker -u redis://redis:6379/0 inquiry_mail:default
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PLATFORM_DATA_DIR=/data
    env_file:
      - .env
    volumes:
      - platform_data:/data
      - ./var/gmail_client_secret.json:/app/var/gmail_client_secret.json:ro
      - ./var/gmail_token.json:/app/var/gmail_token.json:ro
    depends_on:
      redis:
        condition: service_healthy

  # ---- RQ Worker: 邮件发送 ----
  worker-send:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    image: ai-lead-platform:latest
    command: rq worker -u redis://redis:6379/0 inquiry_mail:send
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - PLATFORM_DATA_DIR=/data
    env_file:
      - .env
    volumes:
      - platform_data:/data
      - ./var/gmail_client_secret.json:/app/var/gmail_client_secret.json:ro
      - ./var/gmail_token.json:/app/var/gmail_token.json:ro
    depends_on:
      redis:
        condition: service_healthy

  # ---- Nginx 反向代理 ----
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web

volumes:
  redis_data:
  platform_data:
  nginx_logs:
