{% extends "base.html" %}
{% block title %}登录 - 外贸客户平台{% endblock %}
{% block content %}
<div class="login-container" style="max-width:400px;margin:80px auto;padding:2rem;">
  <h2 style="text-align:center;margin-bottom:1.5rem;">登录</h2>
  {% if error %}
  <div class="alert alert-error" style="color:#d32f2f;background:#fde8e8;padding:0.75rem;border-radius:4px;margin-bottom:1rem;">
    {{ error }}
  </div>
  {% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="redirect" value="{{ redirect }}">
    <div style="margin-bottom:1rem;">
      <label for="username" style="display:block;margin-bottom:0.25rem;font-weight:500;">用户名</label>
      <input type="text" id="username" name="username" required autofocus
             style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:1.5rem;">
      <label for="password" style="display:block;margin-bottom:0.25rem;font-weight:500;">密码</label>
      <input type="password" id="password" name="password" required
             style="width:100%;padding:0.5rem;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;">
    </div>
    <button type="submit" style="width:100%;padding:0.6rem;background:#1a73e8;color:#fff;border:none;border-radius:4px;font-size:1rem;cursor:pointer;">
      登录
    </button>
  </form>
</div>
{% endblock %}
